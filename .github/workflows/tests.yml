name: N2A Lab tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile source
        run: |
          python -m compileall -q app.py n2a tests scripts pages
          bash -n scripts/*.sh
      - name: Run unit tests
        run: python -m pytest -q
      - name: Audit pinned When2Tool dataset
        run: python -m n2a.cli audit-when2tool --output-dir /tmp/when2tool-audit
